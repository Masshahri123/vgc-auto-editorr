

      - name: Check required files
        continue-on-error: true
        run: |
          echo "DEBUG: Checking repository files"
          pwd
          find . -maxdepth 4 -type f | sort

          for file in src/render.py input/video.mp4 input/script.txt
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

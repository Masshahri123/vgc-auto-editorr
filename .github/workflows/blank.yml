
name: VGC Auto Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Check required files
        run: |
          echo "Checking VGC files"

          for file in src/render.py input/script.txt input/video.mp4
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done


      - name: Render VGC without ElevenLabs
        run: |
          mkdir -p output
          ffmpeg -y \
            -i input/video.mp4 \
            -c:v libx264 \
            -preset fast \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -movflags +faststart \
            output/final_video.mp4

          
